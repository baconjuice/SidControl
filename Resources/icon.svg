    <circle cx="280" cy="756" r="13" fill="#050506" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <text x="526.0" y="712" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-weight="800"
